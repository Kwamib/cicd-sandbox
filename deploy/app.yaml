apiVersion: batch/v1
kind: CronJob
metadata:
  name: visits
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: visits
              image: ghcr.io/kwamib/cicd-sandbox@sha256:dd4ac790dd2473b6d6c55867d5a7d58731e8dd0ea8e0bfd18c4dcc4c231693c3
              args: ["  Production Run "]
