apiVersion: batch/v1
kind: CronJob
metadata:
  name: visits
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: visits
              image: ghcr.io/kwamib/cicd-sandbox@sha256:b13eb29d9b81b0813b983188824cb697dbaeb02454df834a811969520ab14835
              args: ["  Production Run "]
