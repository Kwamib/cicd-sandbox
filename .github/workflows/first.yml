name: First pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  where-am-i:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Running on $(hostname) as $(whoami) in $(pwd)"

  lint:
    needs: where-am-i
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Lint would run here"

  tests:
    needs: where-am-i
    runs-on: ubuntu-24.04
    steps:
      - run: exit 1

  helm:
    needs: where-am-i
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Helm check would run here"

  build:
    needs: [lint, tests, helm]
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Would build an image for run ${{ github.run_number }}"
